version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Matches minimumReleaseAge in pnpm-workspace.yaml, so update PRs can install.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all minor and patch bumps; majors arrive individually for review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node is pinned to 22 (.nvmrc, CI, engines), and the types must describe the
      # runtime we run on. Remove this rule in the same PR that moves Node up a major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
