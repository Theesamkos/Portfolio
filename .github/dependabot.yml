version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Matches minimumReleaseAge in pnpm-workspace.yaml, so update PRs can install.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all minor and patch bumps; majors arrive individually for review.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
