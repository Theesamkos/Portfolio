# Supply-chain delay: only install versions published at least 3 days ago (value is in
# minutes), so a compromised release has time to be caught and pulled first.
minimumReleaseAge: 4320

ignoredBuiltDependencies:
  # lefthook's own postinstall is skipped; the "prepare" script installs the hooks instead.
  - lefthook
  - sharp
  - unrs-resolver
